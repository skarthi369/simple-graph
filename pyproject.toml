[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simplegraph-framework"
version = "0.1.0"
description = "A multi-agent orchestration framework prioritizing Absolute Simplicity, Total Transparency, and High Customizability."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/username/simplegraph"
Bug-Tracker = "https://github.com/username/simplegraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/simplegraph"]
